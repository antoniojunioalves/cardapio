name: cardapio-online

services:
  postgres:
    image: postgres:18-alpine
    container_name: cardapio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cardapio}
      # Roles criadas pelos scripts de inicialização. São duas de propósito:
      # o migrator é dono das tabelas e tem DDL; a aplicação só tem DML e por
      # isso não consegue desligar as policies de RLS. Ver docker/postgres/init/.
      MIGRATOR_DB_USER: ${MIGRATOR_DB_USER:-cardapio_migrator}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:-cardapio_migrator}
      APP_DB_USER: ${APP_DB_USER:-cardapio_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-cardapio_app}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # O PostgreSQL 18 usa PGDATA=/var/lib/postgresql/18/docker, e não mais
      # /var/lib/postgresql/data. Montamos o diretório pai para que o volume
      # continue correto independentemente da versão.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Pela rede (-h 127.0.0.1), e não pelo socket local: na primeira
      # inicialização, o servidor temporário que roda os scripts de init escuta
      # só no socket, e o healthcheck daria "pronto" antes de as roles e o banco
      # de testes existirem. O CI depende disso (`docker compose up --wait`).
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cardapio}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
