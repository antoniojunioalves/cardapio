# Confere cada PR e cada commit na main: formatação, typecheck, lint, testes e build.
#
# Os passos são os do `pnpm verify`, separados para o GitHub mostrar qual falhou. O
# PostgreSQL sobe pelo mesmo docker-compose.yml do desenvolvimento, para que os
# scripts de docker/postgres/init criem as duas roles e o banco de testes exatamente
# como na máquina de quem desenvolve.
#
# Sem segredos e sem .env: os testes usam os valores de desenvolvimento, que já são
# o padrão do docker-compose.yml e do apps/api/vitest.config.ts.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo no mesmo PR cancela a execução anterior, que já nasceu velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O workflow só lê o repositório. Sem esta linha, o token recebe as permissões
# padrão do repositório, que podem incluir escrita.
permissions:
  contents: read

jobs:
  verificar:
    name: Formatação, typecheck, lint, testes e build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # Actions fixadas pelo commit, e não pela tag: uma tag pode ser movida por
      # quem controla a action; um commit, não. Para atualizar, troque o commit e
      # o comentário juntos.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nada aqui faz push: o token não precisa ficar gravado no .git/config.
          persist-credentials: false

      # Sem `version`: a versão vem do campo `packageManager` do package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Subir o PostgreSQL
        # O healthcheck do compose só dá "pronto" depois dos scripts de init.
        run: docker compose up -d --wait postgres

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testes
        # Um pacote por vez (está no script): em paralelo, as suítes disputam
        # memória, e o processo já foi derrubado por isso (código 137).
        run: pnpm test

      - name: Build
        run: pnpm build
